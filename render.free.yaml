services:
  - type: web
    name: codeatlas-free
    runtime: python
    region: oregon
    # Free tier: $0, but with trade-offs (see README):
    # - NO persistent disk: ChromaDB, SQLite history and cloned repos are
    #   wiped on every restart/redeploy.
    # - Sleeps after 15 min of inactivity (slow cold start on next visit,
    #   and a sleep mid-onboarding can kill the running job).
    # - 0.1 CPU / 512 MB: large repos may run out of memory.
    plan: free
    healthCheckPath: /health
    buildCommand: |
      # Render's Python image does not include Node, so install it for the frontend build
      curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz -o /tmp/node.tar.xz
      mkdir -p /tmp/nodejs && tar -xJf /tmp/node.tar.xz -C /tmp/nodejs --strip-components=1
      export PATH=/tmp/nodejs/bin:$PATH
      node --version && npm --version
      # Build the Next.js static export into backend/static (served by FastAPI)
      cd frontend && npm ci && npm run build:static
      # Backend deps via uv (uv.lock lives in backend/)
      cd ../backend && pip install uv && uv sync --frozen
    startCommand: cd backend && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Must be fully qualified (Render rejects bare "3.12"/"3.14")
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # NOTE: data paths intentionally left at app defaults (data/...)
      # so everything stays on the ephemeral filesystem.
      # NOTE: NEXT_PUBLIC_API_BASE_URL is intentionally NOT set.
      # The frontend falls back to window.location.origin, which is correct
      # because the single service serves both API and frontend on one domain.
